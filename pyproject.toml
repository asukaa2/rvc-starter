[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvc-starter"
version = "0.1.0"
description = "Retrieval-based Voice Conversion (RVC) starter pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "asukaa2" }]
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numba>=0.57",
    "praat-parselmouth>=0.4.3",
    "faiss-cpu>=1.7.4",
    "omegaconf>=2.3",
    "einops>=0.6",
    "matplotlib>=3.5",
    "requests>=2.28",
    "tqdm>=4.64",
    "beautifulsoup4>=4.11",
    "pycryptodome>=3.17",
]

[project.optional-dependencies]
opencl = ["pytorch-ocl>=0.0.5"]
webui = ["gradio>=5.0"]

[project.scripts]
rvc-infer = "rvc.cli:main"
rvc-webui = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["rvc*", "tabs*", "child*"]
